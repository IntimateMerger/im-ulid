name: Publish to ArtifactRegistry

permissions:
  id-token: write
  contents: read

env:
  # webpack 5.44 が node 17+ で動かない (ERR_OSSL_EVP_UNSUPPORTED) ため、
  # build step では旧 OpenSSL provider を有効化する。migration PR で
  # webpack 5.105+ に上がれば不要になる。
  NODE_OPTIONS: --openssl-legacy-provider

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/451915692272/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: gha-artifactregistry@intimatemerger.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 18.x

      - run: yarn install --immutable

      - run: yarn run build

      - name: Login to ArtifactRegistry
        run: yarn run artifactregistry-login

      - name: Publish to ArtifactRegistry
        run: yarn publish --non-interactive --no-git-tag-version
